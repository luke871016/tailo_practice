<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#efefef">
  <title>錯題本｜練台羅</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%235c8273'/%3E%3Ctext x='32' y='46' font-size='40' text-anchor='middle' fill='white' font-family='sans-serif'%3E%C3%A1%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="icon-btn" href="../" aria-label="回首頁">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg>
      </a>
      <h1 class="topbar-title">錯題本</h1>
      <span class="icon-btn" aria-hidden="true"></span>
    </header>

    <div class="chips" id="filters" hidden></div>

    <ul class="review-list card mistake-list" id="mistakeList" hidden></ul>

    <div class="empty-state" id="emptyState" hidden>
      <p class="empty-title">目前沒有錯題</p>
      <p class="empty-text">練習時答錯的題目會自動收進這裡</p>
      <a class="btn btn-outline" href="../">去練習</a>
    </div>

    <div class="mistake-footer" id="footer" hidden>
      <p class="mistake-hint">「已答對」表示這題答錯後，又在練習中答對了</p>
      <button class="btn btn-ghost btn-block" id="clearBtn" type="button">清空錯題</button>
    </div>
  </div>

  <script src="../js/common.js"></script>
  <script src="../js/tones.js"></script>
  <script src="mistakes.js"></script>
</body>
</html>
