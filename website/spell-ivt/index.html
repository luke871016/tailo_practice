<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#efefef">
  <title>聲韻調拼寫｜練台羅</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%235c8273'/%3E%3Ctext x='32' y='46' font-size='40' text-anchor='middle' fill='white' font-family='sans-serif'%3E%C3%A1%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Iansui&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="page-fit">
  <script src="../data/tone-syllables.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/tones.js"></script>
  <script src="../js/quiz-shell.js"></script>
  <script src="../js/mode-spelling.js"></script>
  <script>
    (function () {
      const data = window.TONE_SYLLABLES.filter((d) => LianTailo.TONE_BY_NUMBER[d.p[0][2]]);
      const finals = Array.from(new Set(data.map((d) => d.p[0][1])));
      QuizShell.create(
        {
          unit: 'spell-3',
          title: '聲韻調拼寫',
          data,
          groupBy: (d) => d.p[0][2],
          poolPerGroup: LianTailo.POOL_PER_GROUP.tone,
        },
        SpellingMode.create({ kind: 'ivt', finals })
      );
    })();
  </script>
</body>
</html>
