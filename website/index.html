<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#efefef">
  <title>練台羅</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%235c8273'/%3E%3Ctext x='32' y='46' font-size='40' text-anchor='middle' fill='white' font-family='sans-serif'%3E%C3%A1%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="home-header">
      <h1 class="home-title">練台羅</h1>
      <p class="home-subtitle">Liān Tâi-lô</p>
    </header>

    <main>
      <p class="section-label">本調練習</p>
      <nav class="unit-list">
        <a class="unit-card" href="tone-draw/">
          <div class="unit-icon" aria-hidden="true">á</div>
          <div class="unit-body">
            <h2 class="unit-name">畫出單音節聲調</h2>
            <p class="unit-desc">聽音檔，在正確的字母上方畫出調符</p>
          </div>
          <svg class="unit-chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
        </a>
        <a class="unit-card" href="pitch-choice/">
          <div class="unit-icon" aria-hidden="true">
            <svg width="30" height="24" viewBox="0 0 30 24" fill="none" stroke="currentColor" stroke-linecap="round"><g stroke-width="1" opacity="0.35"><path d="M2 3h26M2 7.5h26M2 12h26M2 16.5h26M2 21h26"/></g><path d="M4 3 L24 12" stroke-width="2.4"/><path d="m20.5 8.2 4.3 4.2-6 .9" stroke-width="2.2" stroke-linejoin="round"/></svg>
          </div>
          <div class="unit-body">
            <h2 class="unit-name">選單音節音值</h2>
            <p class="unit-desc">看音節，從四個音值圖選出正確的</p>
          </div>
          <svg class="unit-chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
        </a>
      </nav>

      <p class="section-label section-gap">變調練習</p>
      <nav class="unit-list">
        <a class="unit-card" href="tone-draw-2/">
          <div class="unit-icon is-small" aria-hidden="true">ā-á</div>
          <div class="unit-body">
            <h2 class="unit-name">畫出雙音節聲調</h2>
            <p class="unit-desc">聽常用詞，畫出兩個音節的調符</p>
          </div>
          <svg class="unit-chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
        </a>
        <a class="unit-card" href="pitch-choice-2/">
          <div class="unit-icon" aria-hidden="true">
            <svg width="32" height="24" viewBox="0 0 32 24" fill="none" stroke="currentColor" stroke-linecap="round"><g stroke-width="1" opacity="0.35"><path d="M2 3h28M2 7.5h28M2 12h28M2 16.5h28M2 21h28"/></g><path d="M4 12h8" stroke-width="2.4"/><path d="M19 3 L28 12" stroke-width="2.4"/></svg>
          </div>
          <div class="unit-body">
            <h2 class="unit-name">選雙音節音值</h2>
            <p class="unit-desc">看常用詞，選出前字變調後的音值圖</p>
          </div>
          <svg class="unit-chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
        </a>
      </nav>

      <p class="section-label section-gap">拼寫練習</p>
      <nav class="unit-list">
        <a class="unit-card" href="spell-part/">
          <div class="unit-icon is-small" aria-hidden="true">k_</div>
          <div class="unit-body">
            <h2 class="unit-name">選聲母／韻母</h2>
            <p class="unit-desc">聽音檔，選出音節缺少的聲母或韻母</p>
          </div>
          <svg class="unit-chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
        </a>
        <a class="unit-card" href="spell-iv/">
          <div class="unit-icon is-small" aria-hidden="true">k+a</div>
          <div class="unit-body">
            <h2 class="unit-name">聲韻拼寫</h2>
            <p class="unit-desc">聽音檔，依序選出聲母和韻母</p>
          </div>
          <svg class="unit-chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
        </a>
        <a class="unit-card" href="spell-ivt/">
          <div class="unit-icon is-small" aria-hidden="true">k+á</div>
          <div class="unit-body">
            <h2 class="unit-name">聲韻調拼寫</h2>
            <p class="unit-desc">聽音檔，依序選出聲母、韻母和聲調</p>
          </div>
          <svg class="unit-chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
        </a>
      </nav>
      <p class="home-note">更多單元準備中</p>

      <p class="section-label section-gap">我的紀錄</p>
      <a class="unit-card" href="mistakes/">
        <div class="unit-icon" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3"/><path d="m10 8 4 4m0-4-4 4"/></svg>
        </div>
        <div class="unit-body">
          <h2 class="unit-name">錯題本</h2>
          <p class="unit-desc">所有單元答錯過的題目</p>
        </div>
        <span class="count-badge" id="mistakeCount" hidden></span>
        <svg class="unit-chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
      </a>

      <p class="section-label section-gap">練習設定</p>
      <div class="settings card">
        <div class="setting-row">
          <div class="setting-text">
            <p class="setting-name">每次練習題數</p>
          </div>
          <div class="segmented" id="countSetting" role="radiogroup" aria-label="每次練習題數"></div>
        </div>
        <label class="setting-row" for="hanjiSetting">
          <div class="setting-text">
            <p class="setting-name">題目顯示漢字</p>
            <p class="setting-desc">作答後的解答一律會顯示漢字</p>
          </div>
          <input class="switch" type="checkbox" id="hanjiSetting" role="switch">
        </label>
      </div>
    </main>
  </div>

  <script src="js/common.js"></script>
  <script>
    (function () {
      const badge = document.getElementById('mistakeCount');
      function update() {
        const n = LianTailo.mistakes.list().length;
        badge.hidden = n === 0;
        badge.textContent = n;
      }
      // 從單元按返回時頁面可能來自快取，需重新讀取
      window.addEventListener('pageshow', update);
    })();

    (function () {
      const { settings } = LianTailo;
      const countGroup = document.getElementById('countSetting');
      const hanjiSwitch = document.getElementById('hanjiSetting');

      function render() {
        const s = settings.get();
        countGroup.textContent = '';
        settings.COUNT_OPTIONS.forEach((n) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.setAttribute('role', 'radio');
          btn.setAttribute('aria-checked', String(n === s.count));
          btn.className = n === s.count ? 'is-active' : '';
          btn.textContent = n;
          btn.addEventListener('click', () => {
            settings.set({ count: n });
            render();
          });
          countGroup.appendChild(btn);
        });
        hanjiSwitch.checked = s.showHanji;
      }

      hanjiSwitch.addEventListener('change', () => settings.set({ showHanji: hanjiSwitch.checked }));
      window.addEventListener('pageshow', render);
    })();
  </script>
</body>
</html>
