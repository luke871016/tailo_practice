<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#efefef">
  <title data-i18n="brand.title">練台羅 Liān Tâi-lô</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%235c8273'/%3E%3Ctext x='32' y='46' font-size='40' text-anchor='middle' fill='white' font-family='sans-serif'%3E%C3%A1%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Iansui&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    if ('serviceWorker' in navigator) {
      var css = document.querySelector('link[rel="stylesheet"][href*="style.css"]');
      var root = css ? css.getAttribute('href').replace(/css\/style\.css(?:\?.*)?$/, '') : './';
      navigator.serviceWorker.register(root + 'sw.js');
    }
  </script>

</head>
<body>
  <div class="app">
    <header class="home-header">
      <div>
        <h1 class="home-title" data-i18n="brand.title">練台羅 Liān Tâi-lô</h1>
        <p class="home-subtitle" data-i18n="home.subtitle">一起練習基本功</p>
      </div>
      <div class="home-tools">
        <a class="icon-btn home-tool" href="mistakes/" data-i18n-aria="home.mistakes" aria-label="錯題本">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3"/><path d="m10 8 4 4m0-4-4 4"/></svg>
          <span class="count-badge home-badge" id="mistakeCount" hidden></span>
        </a>
        <button class="icon-btn" id="settingsBtn" type="button" data-i18n-aria="home.settings" aria-label="練習設定" aria-haspopup="dialog" aria-controls="settingsSheet" aria-expanded="false">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </header>

    <main class="home-main">
      <article class="practice-card card" data-type="spell">
        <a class="practice-link" href="spell-part/">
          <div class="unit-icon is-small is-spell" aria-hidden="true">k+á</div>
          <div class="unit-body">
            <div class="unit-title-row">
              <h2 class="unit-name" data-i18n="group.spell">練拼寫</h2>
              <svg class="unit-chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
            </div>
            <p class="unit-desc" data-i18n="desc.spell">聽音檔，選出聲母、韻母和聲調</p>
          </div>
        </a>
        <div class="segmented practice-levels" role="radiogroup" data-i18n-aria="aria.level.spell" aria-label="拼寫難度">
          <button type="button" role="radio" data-level="part" data-i18n="level.spell.part">聲母／韻母</button>
          <button type="button" role="radio" data-level="iv" data-i18n="level.spell.iv">聲母＋韻母</button>
          <button type="button" role="radio" data-level="ivt" data-i18n="level.spell.ivt">聲＋韻＋聲調</button>
        </div>
      </article>

      <article class="practice-card card" data-type="tone">
        <a class="practice-link" href="tone-draw/">
          <div class="unit-icon" aria-hidden="true">á</div>
          <div class="unit-body">
            <div class="unit-title-row">
              <h2 class="unit-name" data-i18n="group.tone">標聲調</h2>
              <svg class="unit-chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
            </div>
            <p class="unit-desc" data-i18n="desc.tone">聽音檔，在正確的字母上方畫出調符</p>
          </div>
        </a>
        <div class="segmented practice-levels" role="radiogroup" data-i18n-aria="aria.level.tone" aria-label="畫聲調難度">
          <button type="button" role="radio" data-level="1" data-i18n="level.base">本調（單音節）</button>
          <button type="button" role="radio" data-level="2" data-i18n="level.sandhi">本調＋變調（雙音節）</button>
        </div>
      </article>

      <article class="practice-card card" data-type="pitch">
        <a class="practice-link" href="pitch-choice/">
          <div class="unit-icon is-pitch" aria-hidden="true">
            <svg width="30" height="24" viewBox="0 0 30 24" fill="none" stroke="currentColor" stroke-linecap="round"><g stroke-width="1" opacity="0.35"><path d="M2 3h26M2 7.5h26M2 12h26M2 16.5h26M2 21h26"/></g><path d="M4 3 L24 12" stroke-width="2.4"/><path d="m20.5 8.2 4.3 4.2-6 .9" stroke-width="2.2" stroke-linejoin="round"/></svg>
          </div>
          <div class="unit-body">
            <div class="unit-title-row">
              <h2 class="unit-name" data-i18n="group.pitch">選音值</h2>
              <svg class="unit-chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
            </div>
            <p class="unit-desc" data-i18n="desc.pitch">看常用詞，選出前字變調後的音值圖</p>
          </div>
        </a>
        <div class="segmented practice-levels" role="radiogroup" data-i18n-aria="aria.level.pitch" aria-label="選音值難度">
          <button type="button" role="radio" data-level="1" data-i18n="level.base">本調（單音節）</button>
          <button type="button" role="radio" data-level="2" data-i18n="level.sandhi">本調＋變調（雙音節）</button>
        </div>
      </article>

      <article class="practice-card card" data-type="type">
        <a class="practice-link" href="type/">
          <div class="unit-icon is-type" aria-hidden="true">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.5v15"/><path d="M8.5 4.5h7"/><path d="M8.5 19.5h7"/></svg>
          </div>
          <div class="unit-body">
            <div class="unit-title-row">
              <h2 class="unit-name" data-i18n="group.type">練打字</h2>
              <svg class="unit-chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
            </div>
            <p class="unit-desc" data-i18n="desc.type">聽音檔，打出對應的台羅</p>
          </div>
        </a>
        <div class="segmented practice-levels" role="radiogroup" data-i18n-aria="aria.level.type" aria-label="打字難度">
          <button type="button" role="radio" data-level="1" data-i18n="level.base">本調（單音節）</button>
          <button type="button" role="radio" data-level="2" data-i18n="level.sandhi">本調＋變調（雙音節）</button>
        </div>
      </article>
    </main>
  </div>

  <div class="sheet" id="settingsSheet" hidden>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="sheet-handle"></div>
      <h2 class="sheet-title" id="settingsTitle" data-i18n="home.settings">練習設定</h2>
      <div class="settings card">
        <div class="setting-row is-stack">
          <div class="setting-text">
            <p class="setting-name" data-i18n="settings.lang">介面語言</p>
          </div>
          <div class="segmented" id="langSetting" role="radiogroup" data-i18n-aria="settings.lang" aria-label="介面語言"></div>
        </div>
        <div class="setting-row is-stack">
          <div class="setting-text">
            <p class="setting-name" data-i18n="settings.count">每次練習題數</p>
          </div>
          <div class="segmented" id="countSetting" role="radiogroup" data-i18n-aria="settings.count" aria-label="每次練習題數"></div>
        </div>
        <label class="setting-row" for="hanjiSetting">
          <div class="setting-text">
            <p class="setting-name" data-i18n="settings.hanji">題目顯示漢字</p>
            <p class="setting-desc" data-i18n="settings.hanji.desc">作答後的解答一律會顯示漢字</p>
          </div>
          <input class="switch" type="checkbox" id="hanjiSetting" role="switch">
        </label>
        <button class="setting-row" id="installBtn" type="button">
          <div class="setting-text">
            <p class="setting-name" data-i18n="settings.install">安裝到主畫面</p>
            <p class="setting-desc" id="installDesc" data-i18n="settings.install.desc">加到手機主畫面，像 App 一樣打開</p>
          </div>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 8 5-5 5 5"/><path d="M5 15v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></svg>
        </button>
      </div>
      <footer class="credits">
        <p><span data-i18n="credit.author">網頁作者：</span><a href="https://kiantiong.com/" target="_blank" rel="noopener noreferrer">Tân Kiàn-tiong</a></p>
        <p><span data-i18n="credit.source">專案原始碼：</span><a href="https://github.com/luke871016/tailo_practice" target="_blank" rel="noopener noreferrer">GitHub</a></p>
      </footer>
    </div>
  </div>

  <div class="sheet" id="installSheet" hidden>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="installTitle">
      <div class="sheet-handle"></div>
      <h2 class="sheet-title" id="installTitle" data-i18n="install.title">安裝到主畫面</h2>
      <p class="sheet-text install-lead" id="installLead" data-i18n="install.lead">加到主畫面後，不用再開瀏覽器就能練習。</p>
      <ol class="install-steps" id="installSteps"></ol>
      <button class="btn btn-primary btn-block" id="installAction" type="button" data-i18n="install.done">知道了</button>
    </div>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/common.js"></script>
  <script>
    (function () {
      const { settings, t } = LianTailo;
      const HREF = {
        tone: { '1': 'tone-draw/', '2': 'tone-draw-2/' },
        pitch: { '1': 'pitch-choice/', '2': 'pitch-choice-2/' },
        spell: { part: 'spell-part/', iv: 'spell-iv/', ivt: 'spell-ivt/' },
        type: { '1': 'type/', '2': 'type-2/' },
      };
      const LEVEL_NAME = {
        tone: { '1': 'level.base', '2': 'level.sandhi' },
        pitch: { '1': 'level.base', '2': 'level.sandhi' },
        spell: { part: 'level.spell.part.short', iv: 'level.spell.iv.short', ivt: 'level.spell.ivt.short' },
        type: { '1': 'level.base', '2': 'level.sandhi' },
      };

      const badge = document.getElementById('mistakeCount');
      const langGroup = document.getElementById('langSetting');
      const countGroup = document.getElementById('countSetting');
      const hanjiSwitch = document.getElementById('hanjiSetting');
      const settingsBtn = document.getElementById('settingsBtn');
      const settingsSheet = document.getElementById('settingsSheet');

      function applyLevels() {
        const level = settings.get().level;
        document.querySelectorAll('.practice-card').forEach((card) => {
          const type = card.dataset.type;
          const current = level[type];
          const link = card.querySelector('.practice-link');
          const name = card.querySelector('.unit-name').textContent;
          link.href = HREF[type][current];
          link.setAttribute('aria-label', t('home.start', { name, level: t(LEVEL_NAME[type][current]) }));
          card.querySelectorAll('.practice-levels button').forEach((btn) => {
            const on = btn.dataset.level === current;
            btn.classList.toggle('is-active', on);
            btn.setAttribute('aria-checked', String(on));
          });
        });
      }

      function updateMistakes() {
        const n = LianTailo.mistakes.list().length;
        badge.hidden = n === 0;
        badge.textContent = n;
        badge.parentElement.setAttribute('aria-label', n ? t('home.mistakes.count', { n }) : t('home.mistakes'));
      }

      function renderSettings() {
        const s = settings.get();
        langGroup.textContent = '';
        settings.LANG_OPTIONS.forEach((code) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.setAttribute('role', 'radio');
          btn.setAttribute('aria-checked', String(code === s.lang));
          btn.className = code === s.lang ? 'is-active' : '';
          btn.textContent = t(code === 'tai' ? 'lang.tai' : 'lang.zh');
          btn.addEventListener('click', () => {
            if (code === s.lang) return;
            settings.set({ lang: code });
            location.reload();
          });
          langGroup.appendChild(btn);
        });
        countGroup.textContent = '';
        settings.COUNT_OPTIONS.forEach((n) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.setAttribute('role', 'radio');
          btn.setAttribute('aria-checked', String(n === s.count));
          btn.className = n === s.count ? 'is-active' : '';
          btn.textContent = n;
          btn.addEventListener('click', () => {
            settings.set({ count: n });
            renderSettings();
          });
          countGroup.appendChild(btn);
        });
        hanjiSwitch.checked = s.showHanji;
      }

      function openSettings() {
        settingsSheet.hidden = false;
        settingsBtn.setAttribute('aria-expanded', 'true');
      }

      function closeSettings() {
        settingsSheet.hidden = true;
        settingsBtn.setAttribute('aria-expanded', 'false');
      }

      document.querySelectorAll('.practice-levels').forEach((group) => {
        group.addEventListener('click', (e) => {
          const btn = e.target.closest('button');
          if (!btn) return;
          const type = group.closest('.practice-card').dataset.type;
          settings.set({ level: { [type]: btn.dataset.level } });
          applyLevels();
        });
      });

      hanjiSwitch.addEventListener('change', () => settings.set({ showHanji: hanjiSwitch.checked }));
      settingsBtn.addEventListener('click', () => {
        if (settingsSheet.hidden) openSettings();
        else closeSettings();
      });
      settingsSheet.addEventListener('click', (e) => {
        if (e.target === settingsSheet) closeSettings();
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !settingsSheet.hidden) closeSettings();
      });

      const INSTALL_SEEN_KEY = 'lian-tailo:install-hint';
      const installBtn = document.getElementById('installBtn');
      const installDesc = document.getElementById('installDesc');
      const installSheet = document.getElementById('installSheet');
      const installSteps = document.getElementById('installSteps');
      const installLead = document.getElementById('installLead');
      const installAction = document.getElementById('installAction');
      const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
      const ios = /iphone|ipad|ipod/i.test(navigator.userAgent)
        || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      const mobile = ios || /android|mobile/i.test(navigator.userAgent)
        || (window.matchMedia('(max-width: 820px)').matches && window.matchMedia('(pointer: coarse)').matches);
      let deferredInstall = null;

      const INSTALL_COPY = ios ? {
        lead: 'install.lead.ios',
        steps: ['install.ios.1', 'install.ios.2', 'install.ios.3'],
      } : {
        lead: 'install.lead.other',
        steps: ['install.other.1', 'install.other.2', 'install.other.3'],
      };

      function markInstallSeen() {
        try { localStorage.setItem(INSTALL_SEEN_KEY, '1'); } catch (e) { /* 私密瀏覽 */ }
      }

      function fillInstallSteps() {
        installLead.textContent = deferredInstall
          ? t('install.lead.prompt')
          : t(INSTALL_COPY.lead);
        installSteps.hidden = !!deferredInstall;
        installSteps.textContent = '';
        if (!deferredInstall) {
          INSTALL_COPY.steps.forEach((text, i) => {
            const li = document.createElement('li');
            const num = document.createElement('span');
            num.className = 'install-step-num';
            num.textContent = String(i + 1);
            const body = document.createElement('span');
            body.textContent = t(text);
            li.append(num, body);
            installSteps.appendChild(li);
          });
        }
        installAction.textContent = deferredInstall ? t('install.action') : t('install.done');
      }

      function openInstall(fromHint) {
        fillInstallSteps();
        installSheet.hidden = false;
        installSheet.dataset.fromHint = fromHint ? '1' : '';
        if (fromHint) markInstallSeen();
      }

      function closeInstall() {
        installSheet.hidden = true;
      }

      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredInstall = e;
        installDesc.textContent = t('settings.install.ready');
      });

      window.addEventListener('appinstalled', () => {
        deferredInstall = null;
        installBtn.hidden = true;
        closeInstall();
      });

      installBtn.addEventListener('click', () => {
        closeSettings();
        openInstall(false);
      });
      installAction.addEventListener('click', async () => {
        if (!deferredInstall) {
          closeInstall();
          return;
        }
        deferredInstall.prompt();
        try { await deferredInstall.userChoice; } catch (e) { /* 使用者取消 */ }
        deferredInstall = null;
        closeInstall();
      });
      installSheet.addEventListener('click', (e) => {
        if (e.target === installSheet) closeInstall();
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !installSheet.hidden) closeInstall();
      });

      if (standalone) {
        installBtn.hidden = true;
      } else if (mobile) {
        let seen = false;
        try { seen = localStorage.getItem(INSTALL_SEEN_KEY) === '1'; } catch (e) { seen = true; }
        if (!seen) window.setTimeout(() => openInstall(true), 600);
      }

      function render() {
        applyLevels();
        updateMistakes();
        renderSettings();
      }
      render();
      window.addEventListener('pageshow', render);
    })();
  </script>
</body>
</html>
